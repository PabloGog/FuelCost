<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15382e">
  <meta name="description" content="Quickly calculate and split fuel costs for a car trip.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="fuel-icon.svg" type="image/svg+xml">
  <title>Fuel Cost Calculator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18201d;
      --muted: #60706a;
      --paper: #f5f4ee;
      --surface: #ffffff;
      --field: #fbfcfa;
      --line: #d8ddd8;
      --forest: #15382e;
      --forest-hover: #205243;
      --amber: #f0a629;
      --error: #a42822;
      --shadow: 0 20px 60px rgb(21 56 46 / 12%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgb(21 56 46 / 4%) 1px, transparent 1px),
        linear-gradient(rgb(21 56 46 / 4%) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      font-family: "Aptos", "Segoe UI", Roboto, sans-serif;
    }

    main {
      width: min(100% - 32px, 960px);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.8fr);
      align-items: center;
      gap: clamp(32px, 7vw, 88px);
      padding: 48px 0;
    }

    .intro {
      max-width: 520px;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 28px;
      color: var(--forest);
      background: var(--amber);
      border-radius: 8px;
    }

    .mark svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      max-width: 480px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      font-weight: 600;
      line-height: 0.95;
    }

    .intro p {
      max-width: 410px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .calculator {
      padding: clamp(24px, 5vw, 40px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 5px solid var(--amber);
      border-radius: 8px;
      box-shadow: var(--shadow);
      animation: arrive 500ms ease-out both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    form {
      display: grid;
      gap: 18px;
    }

    label,
    .label {
      display: grid;
      gap: 8px;
      color: var(--forest);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      gap: 12px;
    }

    .row > label {
      min-width: 0;
    }

    #currency {
      padding: 0 8px;
      text-align: center;
    }

    /* Input and unit sit side by side, so long numbers never run under the unit. */
    .field {
      display: flex;
      align-items: center;
      min-height: 50px;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 5px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .field:focus-within {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgb(21 56 46 / 12%);
    }

    .field:has(input[aria-invalid="true"]) {
      border-color: var(--error);
    }

    /* width: 0 drops the browser's default ~20 character input width, so fields fit narrow columns. */
    input {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: none;
      font: inherit;
      font-size: 1.05rem;
    }

    .unit {
      flex: none;
      padding-right: 14px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 400;
      text-transform: none;
      white-space: nowrap;
    }

    .stepper {
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center;
      min-height: 50px;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 5px;
      overflow: hidden;
    }

    .stepper button {
      height: 48px;
      color: var(--forest);
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .stepper button:disabled {
      color: var(--line);
      cursor: default;
    }

    .stepper output {
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      text-transform: none;
    }

    button:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    .error {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--error);
      font-size: 0.9rem;
    }

    .result {
      margin-top: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .per-person {
      padding: 18px;
      background: #edf3eb;
    }

    .result span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .result output {
      display: block;
      margin-top: 6px;
      overflow-wrap: anywhere;
      color: var(--forest);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      font-weight: 600;
    }

    .per-person output {
      font-size: clamp(2rem, 6vw, 2.6rem);
      line-height: 1.1;
    }

    .result output .currency {
      display: inline;
      margin-left: 0.3em;
      color: var(--muted);
      font-family: "Aptos", "Segoe UI", Roboto, sans-serif;
      font-size: 0.5em;
      font-weight: 700;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border-top: 1px solid var(--line);
    }

    .details div {
      min-width: 0;
      padding: 14px 18px;
      background: #f7f8f5;
    }

    .share {
      width: 100%;
      min-height: 52px;
      margin-top: 16px;
      color: #fff;
      background: var(--forest);
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background 150ms ease, transform 150ms ease;
    }

    .share:hover:not(:disabled) {
      background: var(--forest-hover);
    }

    .share:active:not(:disabled) {
      transform: translateY(1px);
    }

    .share:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .share[hidden] {
      display: none;
    }

    /* Phones: compact header so the calculator is visible straight away. */
    @media (max-width: 720px) {
      main {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 20px 0 32px;
      }

      .intro {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        column-gap: 14px;
      }

      .mark {
        width: 40px;
        height: 40px;
        margin: 0;
      }

      h1 {
        font-size: 1.7rem;
        line-height: 1.1;
      }

      .intro p {
        grid-column: 1 / -1;
        margin-top: 10px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 420px) {
      main {
        width: min(100% - 20px, 960px);
      }

      .calculator {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .calculator {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"></path>
          <path d="M3 11h12M7 7h4M15 8h2l3 3v7a2 2 0 0 0 2 2"></path>
        </svg>
      </div>
      <h1 id="page-title">Fuel cost, before you go.</h1>
      <p>Enter the trip, pick how many people, share what everyone owes.</p>
    </section>

    <section class="calculator" aria-label="Fuel cost calculator">
      <form id="fuel-form" novalidate>
        <div class="row">
          <label for="price">
            Fuel price
            <span class="field">
              <input id="price" name="price" type="text" inputmode="decimal" autocomplete="off" placeholder="1.75">
              <span class="unit">per L</span>
            </span>
          </label>

          <label for="currency">
            Currency
            <span class="field">
              <input id="currency" name="currency" type="text" autocomplete="off" maxlength="5" placeholder="EUR" spellcheck="false">
            </span>
          </label>
        </div>

        <label for="consumption">
          Average consumption
          <span class="field">
            <input id="consumption" name="consumption" type="text" inputmode="decimal" autocomplete="off" placeholder="7.2">
            <span class="unit">L / 100 km</span>
          </span>
        </label>

        <label for="distance">
          Distance
          <span class="field">
            <input id="distance" name="distance" type="text" inputmode="decimal" autocomplete="off" placeholder="250">
            <span class="unit">km</span>
          </span>
        </label>

        <div class="label" role="group" aria-labelledby="people-label">
          <span id="people-label">People</span>
          <div class="stepper">
            <button type="button" id="people-minus" aria-label="Fewer people">&minus;</button>
            <output id="people" aria-live="polite">2</output>
            <button type="button" id="people-plus" aria-label="More people">+</button>
          </div>
        </div>
      </form>

      <p id="error" class="error" role="alert"></p>

      <div class="result">
        <div class="per-person" aria-live="polite">
          <span>Each person pays</span>
          <output id="per-person">&mdash;</output>
        </div>
        <div class="details">
          <div>
            <span>Total cost</span>
            <output id="total-cost">&mdash;</output>
          </div>
          <div>
            <span>Fuel used</span>
            <output id="liters-used">&mdash;</output>
          </div>
        </div>
      </div>

      <button type="button" id="share" class="share" disabled>Share</button>
    </section>
  </main>

  <script>
    const MIN_PEOPLE = 1;
    const MAX_PEOPLE = 20;
    const STORAGE_KEY = "fuel-cost-values";

    // Default currency from the device region; anything not listed starts empty.
    const REGION_CURRENCY = {
      AT: "EUR", BE: "EUR", BG: "EUR", CY: "EUR", DE: "EUR", EE: "EUR", ES: "EUR",
      FI: "EUR", FR: "EUR", GR: "EUR", HR: "EUR", IE: "EUR", IT: "EUR", LT: "EUR",
      LU: "EUR", LV: "EUR", MT: "EUR", NL: "EUR", PT: "EUR", SI: "EUR", SK: "EUR",
      US: "USD", GB: "GBP", CH: "CHF", PL: "PLN", CZ: "CZK", HU: "HUF", RO: "RON",
      SE: "SEK", NO: "NOK", DK: "DKK", UA: "UAH", TR: "TRY", CA: "CAD", AU: "AUD",
      NZ: "NZD", JP: "JPY", IN: "INR", BR: "BRL", MX: "MXN", ZA: "ZAR"
    };

    const form = document.querySelector("#fuel-form");
    const inputs = ["#price", "#consumption", "#distance"].map((id) => document.querySelector(id));
    const currencyInput = document.querySelector("#currency");
    const error = document.querySelector("#error");
    const peopleOutput = document.querySelector("#people");
    const minusButton = document.querySelector("#people-minus");
    const plusButton = document.querySelector("#people-plus");
    const perPersonOutput = document.querySelector("#per-person");
    const totalOutput = document.querySelector("#total-cost");
    const litersOutput = document.querySelector("#liters-used");
    const shareButton = document.querySelector("#share");

    let people = 2;
    let shareText = "";

    function parseNumber(input) {
      const value = input.value.trim().replace(",", ".");
      return value === "" ? Number.NaN : Number(value);
    }

    function format(value) {
      return value.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function regionCurrency() {
      try {
        const region = new Intl.Locale(navigator.language).maximize().region;
        return REGION_CURRENCY[region] || "EUR";
      } catch {
        return "EUR";
      }
    }

    const DEFAULT_CURRENCY = regionCurrency();

    // An empty currency field falls back to the default, so amounts always carry a currency.
    function currency() {
      return currencyInput.value.trim() || DEFAULT_CURRENCY;
    }

    function money(value) {
      return `${format(value)} ${currency()}`;
    }

    // On screen the currency is a smaller label next to the amount.
    function showMoney(output, value) {
      const label = document.createElement("span");
      label.className = "currency";
      label.textContent = currency();
      output.replaceChildren(format(value), label);
    }

    function loadSaved() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    // Keeps the last entered values on this device for the next visit.
    function save() {
      const values = { currency: currencyInput.value, people };
      inputs.forEach((input) => { values[input.id] = input.value; });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
      } catch {
        // Storage blocked; the calculator still works, it just won't remember.
      }
    }

    function showEmpty() {
      perPersonOutput.textContent = "—";
      totalOutput.textContent = "—";
      litersOutput.textContent = "—";
      shareButton.disabled = true;
      shareText = "";
    }

    function calculate() {
      const [price, consumption, distance] = inputs.map(parseNumber);
      let message = "";

      save();

      inputs.forEach((input) => {
        const raw = input.value.trim();
        const value = parseNumber(input);
        const invalid = raw !== "" && (!Number.isFinite(value) || value < 0);
        input.setAttribute("aria-invalid", invalid);
        if (invalid) {
          message = value < 0 ? "Values cannot be negative." : "Use numbers only, e.g. 1.75";
        }
      });

      error.textContent = message;

      if (message || ![price, consumption, distance].every(Number.isFinite)) {
        showEmpty();
        return;
      }

      const liters = consumption * distance / 100;
      const total = price * liters;
      const each = total / people;

      showMoney(perPersonOutput, each);
      showMoney(totalOutput, total);
      litersOutput.textContent = `${format(liters)} L`;

      shareText = people === 1
        ? `Fuel cost: ${format(distance)} km, ${format(liters)} L, total ${money(total)}`
        : `Fuel cost: ${format(distance)} km, ${format(liters)} L, total ${money(total)}, ` +
          `${people} people, ${money(each)} each`;
      shareButton.disabled = false;
    }

    function setPeople(count) {
      people = Math.min(MAX_PEOPLE, Math.max(MIN_PEOPLE, count));
      peopleOutput.textContent = people;
      minusButton.disabled = people === MIN_PEOPLE;
      plusButton.disabled = people === MAX_PEOPLE;
      calculate();
    }

    async function share() {
      if (!shareText) return;
      try {
        if (navigator.share) {
          await navigator.share({ text: shareText });
          return;
        }
        await navigator.clipboard.writeText(shareText);
        shareButton.textContent = "Copied";
        setTimeout(() => { shareButton.textContent = "Share"; }, 1500);
      } catch {
        // Share sheet dismissed or clipboard blocked; nothing to do.
      }
    }

    form.addEventListener("input", calculate);
    form.addEventListener("submit", (event) => event.preventDefault());
    minusButton.addEventListener("click", () => setPeople(people - 1));
    plusButton.addEventListener("click", () => setPeople(people + 1));
    shareButton.addEventListener("click", share);

    if (!navigator.share && !navigator.clipboard) {
      shareButton.hidden = true;
    }

    const saved = loadSaved();
    inputs.forEach((input) => {
      if (typeof saved[input.id] === "string") input.value = saved[input.id];
    });
    currencyInput.placeholder = DEFAULT_CURRENCY;
    currencyInput.value = (typeof saved.currency === "string" && saved.currency.trim()) || DEFAULT_CURRENCY;
    currencyInput.addEventListener("change", () => {
      if (!currencyInput.value.trim()) {
        currencyInput.value = DEFAULT_CURRENCY;
        calculate();
      }
    });
    setPeople(Number.isInteger(saved.people) ? saved.people : people);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {
        // The calculator still works when opened directly from a file.
      });
    }
  </script>
</body>
</html>
